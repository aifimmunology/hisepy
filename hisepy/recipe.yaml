schema_version: 1

context:
  version: 1.15.26.dev1
  python_min: "3.9"

package:
  name: hisepy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/h/hisepy/hisepy-${{ version }}.tar.gz
  sha256: 97fae619613b350020c9156c7e70650280dc57c78f874721c6d5698184715492

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=2.2.3
    - numpy >=1.26.4
    - pyyaml >=6.0.2
    - plotly >=5.23.0
    - dash >=2.17.0
    - python-kaleido >=0.2.1
    - google-cloud-storage >=2.16.0
    - requests >=2.32.3
    - h5py >=3.12.1
    - pyreadr >=0.5.3
    - psutil >=7.0.0
    - termcolor >=2.3.0
    - ray >=2.44.1
    - astor >=0.8.1
    - ipython >=9.5.0
    - tomli-w >=1.2.0
    - google-genai >=1.73.1

tests:
  - python:
      imports:
        - hisepy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Python Interface to the Allen Institute For Immunology's Human Immune System Explorer (HISE)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/aifimmunology/hisepy

extra:
  recipe-maintainers:
    - jamesdharv
