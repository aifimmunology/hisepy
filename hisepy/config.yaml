# help with interacting with materialized view for emr/subject/file etc
# can this just be a list of values...?
MATERIALIZED_VIEW:
  QUERYABLE_FIELDS :
    - file
    - sample
    - subject
  EMR: emr
  LAB: lab

FILETYPES:
  SCRNA_RESULT : scRNA-seq-labeled
  DASH_APP: dash_app.tar.gz

PROMPTS:
  UPLOAD : You are trying to upload file IDs.
  ABSTRACTION: You are about to save an abstract visualization template
  QUERY_ID_READ: "DEPRECATED: You are passing a {} to {}. This parameter is no longer supported and does not work well with when trying to produce a Certificate of Reproducibility. It is recommended to submit a list of file_ids instead"
  UPLOAD_FROM_LEGACY: You are attempting to upload a file from a legacy IDE. This is not supported. Please migrate code, data, and results to a nextgen IDE.
  UPLOAD_AS_GUEST: "Warning: You are uploading a file from a guest or certificate account. This action generates a new input file ID but does not preserve your current environment. To save your work, continue with the upload to generate a new input file ID. Then copy the ID and use it in the next IDE node in your workflow. Continue the upload?"
  INVALID_UPLOAD_KERNEL: "You are uploading a result from a kernel that was created from a custom conda environment. This is not supported. Please change to the default kernel and try again."
  CONDA_ENV_BUILD: "Your current conda environment failed to build successfully. Please resolve potential conflicts in your conda environment and try again."
  REVIEW_JOB_OUTPUT: "Training job outputs have been downloaded to your IDE. Please review the outputs, and specify if you want to accept or reject the training job: {}. "
  SAVE_CUSTOM_ENV: "You are about to save a custom {} environment. This will save your current active environment"
  RAY_INIT_EXISTS: "A ray.init() call is detected within your training job script, and will be submitted without modification"
  FAST_MODE_UPLOAD: "You are uploading in fast mode. This will skip checking that your environment can build, and will speed up the entire upload process. Do you want to continue?"

